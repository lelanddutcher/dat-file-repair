# The DATfix desktop app: a Tauri shell around `datfix-core`.
#
# Tauri runs this Rust program as the app's "backend". It opens a native window that shows a
# small web page (the files in `app/src`, built by Vite into `app/dist`). The page calls the Rust
# functions marked `#[tauri::command]` in `src/commands.rs`.
[package]
name = "datfix-app"
description = "Desktop app that repairs interrupted Canon .DAT recordings into MP4"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The library holds all app code so integration tests can call it. `main.rs` only starts it.
[lib]
name = "datfix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
datfix-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# Native "Open file" / "Save as" / "Choose folder" dialogs.
tauri-plugin-dialog = "2"
# "Show in Finder/Explorer" and "Play" (open with the default app).
tauri-plugin-opener = "2"
# Free disk space check before a long write.
fs4 = "1"

[dev-dependencies]
tempfile.workspace = true
