# Cargo workspace: one library crate (the repair engine) and one binary crate (the CLI).
# The Tauri desktop app (`app/src-tauri`) is a third member that depends on `datfix-core`.
[workspace]
resolver = "3"
members = ["crates/datfix-core", "crates/datfix", "app/src-tauri"]
# Plain `cargo build/test/clippy` at the root skips the app: it needs the built web page
# (`app/dist`) and, on Linux, WebKitGTK. Build it with `cargo tauri build` or `-p datfix-app`.
default-members = ["crates/datfix-core", "crates/datfix"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/lelanddutcher/dat-file-repair"

[workspace.dependencies]
datfix-core = { path = "crates/datfix-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
